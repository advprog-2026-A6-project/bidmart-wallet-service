<!DOCTYPE html>
<html lang="en">
<head>
    <title>Wallet Feature</title>
</head>
<body>
<h1>BidMart Wallet</h1>

<hr>

<div>
    <label>Masukkan User ID:</label>
    <input type="number" id="userIdInput" value="1">
    <button onclick="checkWallet()">Cek/Konek Dompet</button>
</div>

<br>

<div id="displayArea" style="display:none;">
    <p>User ID: <span id="resId"></span></p>
    <p>Saldo: <b>Rp<span id="resBalance"></span></b></p>
    <p>Versi DB: <span id="resVersion"></span></p>

    <hr>

    <label>Nominal Top Up:</label>
    <input type="number" id="amountInput">
    <button onclick="doTopUp()">Proses Top Up</button>
</div>

<script>
    const API = "/api/wallet";

    async function checkWallet() {
        const id = document.getElementById('userIdInput').value;
        const res = await fetch(API + "/" + id);
        const data = await res.json();

        document.getElementById('resId').innerText = data.userId;
        document.getElementById('resBalance').innerText = data.balance;
        document.getElementById('resVersion').innerText = data.version;
        document.getElementById('displayArea').style.display = 'block';
    }

    async function doTopUp() {
        const id = document.getElementById('userIdInput').value;
        const amount = document.getElementById('amountInput').value;
        const res = await fetch(API + "/" + id + "/topup?amount=" + amount, {
            method: 'POST'
        });
        const data = await res.json();

        alert("Top Up Berhasil!");
        document.getElementById('resBalance').innerText = data.balance;
        document.getElementById('resVersion').innerText = data.version;
    }
</script>
</body>
</html>
